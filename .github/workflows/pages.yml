name: Deploy to GitHub Pages

# 纯静态站：push 到 main 即自动跑测试 → 组装 → 发布
# 首次使用需在 Settings → Pages → Source 选择 "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 引擎回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 跑选型引擎测试
        run: node test-engine.js

  build:
    name: 组装静态站点
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 只打包运行期需要的文件
        run: |
          mkdir -p _site
          cp index.html site.webmanifest .nojekyll _site/
          cp -r assets _site/assets
          echo "--- 产物 ---"
          du -sh _site
          find _site -type f | wc -l

      - name: 校验入口与关键资源
        run: |
          test -f _site/index.html || { echo "缺 index.html"; exit 1; }
          for f in assets/app-core.js assets/style-core.css assets/mod/manifest.js; do
            test -f "_site/$f" || { echo "缺 $f"; exit 1; }
          done
          echo "关键文件齐全"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 发布
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
